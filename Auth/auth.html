            box-shadow: none;
            outline: none;

        .auth-btn:hover {

        .auth-news-block {
            display: none;
            position: relative;
            height: 255px;
            width: 452px;
        }
        .auth-news-block:before {
            content: '';
            position: absolute;
            left: -1px;
            bottom: -1px;
            height: 100%;
            width: 100%;
            background: linear-gradient(45deg, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.5) 5%, transparent 40%, transparent);
            border-radius: 15px;
            pointer-events: none;
            z-index: 2;
        }
        .auth-news-img {
            position: absolute;
            height: 255px;
            width: 452px;
            border-radius: 15px;
            box-shadow: 0px 0px 10px 1px #000;
            transition: all 0.5s;
            z-index: 1;
        }
        .auth-news-img:hover {
            box-shadow: 0px 0px 20px 1px #000;
        }
        .auth-news-date {
            position: absolute;
            left: 10px;
            bottom: 6px;
            font-family: 'Geometria-Light';
            font-size: 12;
            color: #fff;
            text-shadow: 0px 0px 2px black;
            z-index: 3;
        }
        .auth-news-img-corner {
            position: absolute;
            right: -7px;
            bottom: -5px;
            pointer-events: none;
            z-index: 3;
        }

        @media screen and (min-width: 1300px) {

            .auth-news-block {
                display: block;
            }

            .auth-form-block {
                position: absolute; 
                right: inherit;
                left: 50%; 
                top: 50%; 
                transform: translate(-50%, -50%);
            }
        }

        .auth-character-block {
            position: relative;
            width: 480px;
            height: 147px;
            background: linear-gradient(90.1deg, rgba(38, 54, 94, 0.82) 0.07%, rgba(17, 27, 44, 0.82) 99.91%);
            box-shadow: 0px 0px 28px rgba(0, 0, 0, 0.39);
            border-radius: 9px 75px;
        }
        .auth-character-block:hover {
            background: linear-gradient(90.1deg, rgba(55, 76, 129, 0.82) 0.07%, rgba(17, 27, 44, 0.82) 99.91%);
        }
        .auth-character-block.active {
            background: linear-gradient(90.1deg, rgba(64, 86, 140, 0.82) 0.07%, rgba(30, 48, 75, 0.82) 99.91%);
        }
        .auth-character-block.ban {
            background: linear-gradient(90.2deg, rgba(90, 0, 43, 0.82) 0.16%, rgba(17, 27, 44, 0.82) 50.51%);
