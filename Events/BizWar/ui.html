<html>
<head>
    <link rel="stylesheet" type="text/css" href="package://Lib/css/help.css" media="screen">
    <link rel="stylesheet" type="text/css" href="package://Lib/css/fonts.css" media="screen">
    <link rel="stylesheet" type="text/css" href="package://Menu/UI/style.css" media="screen">
    <script src="package://Lib/js/rage-rpc.min.js"></script>
    <script src="package://Lib/js/jquery.js"></script>
    <script src="package://Lib/js/vue.js"></script>
    <script src="package://Lib/js/preventSelection.js"></script>
    <meta charset="utf-8" />
</head>
<body scroll="no" style="overflow: hidden;">

    <style>

        #bizWarInfoBlock {
            display: flex;
            align-items: center;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .b-elem {
            position: absolute;
        }

        .time-bg {
            padding: 3px;
            border-radius: 5px;
            background: #232323;
        }

        .time-char {
            display: inline-block;
            min-width: 0px;
            width: 10px;
            padding: 1px 2px;
            background: linear-gradient(to left top, #0a5ad2, #22d4fa);
            text-align: center;
            border-radius: 2px;
        }
    
    </style>
    
    <div id="vueApp">
    <template>
    <div v-if="loaded" id="bizWarInfoBlock">
        <img src="bg.png" style="height: calc(50px * 0.8); width: calc(1084px * 0.8);">
        <div class="menu-text menu-color-red b-elem" style="top: 12px; left: 53px; font-size: 13px;">Атака</div>
        <div class="menu-text f-m menu-color-red b-elem" style="top: 13px; left: 130px; font-size: 13px;">{{ data.attackerCount }}</div>
        <div class="menu-text menu-color-green b-elem" style="top: 12px; right: 53px; font-size: 13px;">Защита</div>
        <div class="menu-text f-m menu-color-green b-elem" style="top: 13px; right: 130px; font-size: 13px;">{{ data.defenderCount }}</div>
        <div class="menu-text f-m b-elem" style="top: 12px; left: 210px; font-size: 13px;">{{ data.attacker }}</div>
        <div class="menu-text f-m b-elem" style="top: 12px; right: 210px; font-size: 13px;">{{ data.defender }}</div>
        <div v-if="data.time > 0" class="b-elem d-flex" style="left: 50%; transform: translateX(-50%);">
            <div class="time-bg">
                <span class="menu-text f-m time-char">{{ getTime(0) }}</span>
                <span class="menu-text f-m time-char">{{ getTime(1) }}</span>
            </div>
            <div class="time-bg" style="margin-left: 2px;">
                <span class="menu-text f-m time-char">{{ getTime(2) }}</span>
                <span class="menu-text f-m time-char">{{ getTime(3) }}</span>
            </div>
        </div>
        <div v-else class="menu-text menu-color-blue b-elem text-center" style="left: 50%; width: 180px; transform: translateX(-50%); line-height: 0.9;">Время вышло, убейте всех противников</div>
    </div>
    </template>
    </div>

    <script>let vueApp=new Vue({el:"#vueApp",data:{data:null,interval:null,loaded:!1},methods:{getTime(a){function b(a){return 10<=a?a.toString():"0"+a.toString()}return`${b(Math.floor(this.data.time/60))}${b(this.data.time%60)}`[a]},update({attackerCount:a,defenderCount:b,time:c}){this.data&&(this.data.attackerCount=a,this.data.defenderCount=b,this.data.time=c)},load:function(a){this.data=a,null!=this.interval&&clearInterval(this.interval),this.interval=setInterval(()=>{this.data.time--},1e3),this.loaded=!0}}});rpc.on("load_data",vueApp.load),rpc.on("update_data",vueApp.update);</script>
</body>
</html>
